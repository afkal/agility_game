[package]
name = "agility_game"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = "0.20.1"
rand = "0.10.4"

# Bevy recommends optimizing dependencies even in dev builds; the game code itself stays fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
